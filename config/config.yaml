defaults:
  - model: dynadust3r
  - optim: adamw
  # - sched: cosine
  - criterion: unified  # unified criterion with single normalization (was: conf)
  - dataset/pointodyssey@dataset.pointodyssey
  - dataset/stereo4d@dataset.stereo4d
  - _self_

seed: 2

debug: False

# Scheduler configuration
# To disable scheduler: sched: null
# To enable scheduler: add "- sched: <scheduler_name>" to defaults list above
# Available schedulers: cosine, exponentiallr, linear, onecycle, reducelronplateau, steplr
# Examples:
#   For cosine scheduler: add "- sched: cosine" to defaults and remove "sched: null" line
#   For step scheduler: add "- sched: steplr" to defaults and remove "sched: null" line
sched: null

train:
  validation_frequency: 2000  # Combined validation frequency (replaces both epoch_frequency and valid.interval)
  iterations: 98000           # Total number of training iterations
  grad_clip: 0
  grad_acc: 2                 # Gradient accumulation steps (1 = no accumulation)

valid:
  save:
    save_best: True
    best_metric: loss
    lower_is_better: True
    keep_top_k: 20
    output_dir: weights/

data:
  loader: stereo4d # [stereo4d, pointodyssey]
  len: ???         # Will be calculated in Python: iterations * batch_size | ???
  valid_len: 1000  # Will be calculated in Python: this * batch_size | 300
  size: 512        # image size | also change in model/dynadust3r.yaml
  crop: True
  batch_size: 4
  num_workers: 16
  prefetch_fact: 1

logging:
  use_wandb: True
  wandb_interval: 5

infer:
  # checkpoint_path: /scratch/km6748/vision-experiments/outputs/2025-09-28/06-01-28/checkpoints/best_loss_1.482034_iter_84000_epoch_42.pth
  # checkpoint_path: /scratch/km6748/vision-experiments/outputs/2025-09-14/13-03-43/checkpoints/best_loss_1.521715_iter_70000_epoch_35.pth
  # checkpoint_path: /scratch/km6748/vision-experiments/outputs/2025-10-01/14-57-07/checkpoints/best_loss_0.482816_iter_92000_epoch_46.pth
  # checkpoint_path: /scratch/km6748/vision-experiments/outputs/2025-10-09/21-11-57/checkpoints/last_iter_98000_epoch_49.pth
  # checkpoint_path: /scratch/km6748/vision-experiments/outputs/2025-10-09/21-11-57/checkpoints/best_loss_0.480798_iter_90000_epoch_45.pth
  checkpoint_path: /scratch/km6748/dynadust3r-unofficial/dynadust3r-unofficial-weights/best_loss_0.480798_iter_90000_epoch_45.pth
  input_dir: scratch/gifs/new
  output_dir: scratch/gifs/results
  gif_glob: "*.gif"
  device: auto  # auto|cuda|cpu
  num_query_times: 5

  # === filtering knobs ===
  conf_percentile_threshold: 0.45   # keep points with confidence >= this percentile (0..1); 0.75 => top 25%, 0.0 => all
  traj_percentile_threshold: 0.75   # keep trajectories with motion >= this percentile (0..1); 0.75 => top 25%
  conf_percentile_overrides:
    cow: 0.45
    dog_on_field: 0.45
    exhibition: 0.45
    guitar: 0.45
    museum: 0.45
    park: 0.45
    rolling: 0.45

eval:
  adt:
    root_dir: /scratch/projects/fouheylab/km6748/adt/tapvid3d_adt_every_30_frames
    save_dir: ./adt_eval_out
    limit: null        # or an int
    max_depth: 70.0
