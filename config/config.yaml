defaults:
  - model: dynadust3r
  - optim: adam
  # - sched: cosine
  - criterion: unified  # unified criterion with single normalization (was: conf)
  - dataset/pointodyssey@dataset.pointodyssey
  - dataset/stereo4d@dataset.stereo4d
  - _self_

seed: 2

debug: False

# Scheduler configuration
# To disable scheduler: sched: null
# To enable scheduler: add "- sched: <scheduler_name>" to defaults list above
# Available schedulers: cosine, exponentiallr, linear, onecycle, reducelronplateau, steplr
# Examples:
#   For cosine scheduler: add "- sched: cosine" to defaults and remove "sched: null" line
#   For step scheduler: add "- sched: steplr" to defaults and remove "sched: null" line
sched: null

train:
  validation_frequency: 10  # Combined validation frequency (replaces both epoch_frequency and valid.interval)
  iterations: 49000  # Total number of training iterations
  grad_clip: 0

valid:
  save: 
    save_best: True
    best_metric: loss
    lower_is_better: True
    output_dir: weights/

data:
  loader: stereo4d # [stereo4d, pointodyssey]
  len: ??? # Will be calculated in Python: iterations * batch_size | ???
  valid_len: 300 # Will be calculated in Python: this * batch_size | 300
  size: 512 # image size | also change in model/dynadust3r.yaml
  crop: True
  batch_size: 2
  num_workers: 16
  prefetch_fact: 1

logging:
  use_wandb: True
  wandb_interval: 1