model: {}
optim:
  name: adamw
  lr: 0.001
  betas:
  - 0.9
  - 0.95
sched:
  name: cosine
  warmup_pct: 0.1
criterion:
  name: conf
  alpha: 0.2
  inner:
    name: regr3d
    norm_mode: avg_dis
    gt_scale: false
    reduction: mean
dataset:
  pointodyssey:
    name: pointodyssey
    path: /scratch/km6748/data/point_odyssey/
    train_split: test
    valid_split: sample
    max_frame_window: 10
    pm_source: 3d_tracks
train:
  epochs: 100
  grad_clip: 0
valid:
  interval: 5
  save:
    save_best: true
    best_metric: loss
    lower_is_better: true
    output_dir: weights/
data:
  loader: pointodyssey
  batch_size: 2
  num_workers: 4
logging:
  use_wandb: true
  wandb_interval: 1
